{% extends "base.html" %}

{% block content %}
  <h1>Tags
  <a href="{% url 'todo_app:tag-create' %}" class="btn btn-primary">Add</a>
  </h1>
  {% if tag_list %}
    <table class="table align-middle">
      <tr>
        <th style="width: 100px;">Name</th>
        <th style="width: 80px;">Update</th>
        <th style="width: 80px;">Delete</th>
      </tr>
      <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.name }}</td>
          <td>
            <a href="#" class="btn btn-secondary">
              Update
            </a>
          </td>
          <td>
            <a href="#" class="btn btn-secondary">
              Delete
            </a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no tags in TODO-list yet.</p>
  {% endif %}

{% endblock %}
