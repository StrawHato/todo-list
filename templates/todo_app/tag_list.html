{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="mb-0">Tags</h1>
  <a href="{% url 'todo_app:tag-create' %}" class="btn btn-primary">
    Add tag
  </a>
</div>

{% if tag_list %}
  <div class="table-responsive">
    <table class="table table-hover align-middle custom-table">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th class="text-center" style="width: 120px;">Update</th>
          <th class="text-center" style="width: 120px;">Delete</th>
        </tr>
      </thead>

      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td>
              <span class="tag-badge">{{ tag.name }}</span>
            </td>

            <td class="text-center">
              <a href="{% url 'todo_app:tag-update' pk=tag.id %}"
                 class="btn btn-outline-primary btn-sm">
                Update
              </a>
            </td>

            <td class="text-center">
              <a href="{% url 'todo_app:tag-delete' pk=tag.id %}"
                 class="btn btn-outline-danger btn-sm">
                Delete
              </a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="text-muted">There are no tags in TODO-list yet.</p>
{% endif %}

{% endblock %}
