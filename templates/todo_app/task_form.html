{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}

  <h1 class="mb-4">
    {{ object|yesno:"Update,Create" }} task
  </h1>

  <form method="post" novalidate>
    {% csrf_token %}

    {{ form|crispy }}

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary">
        Save
      </button>

      <a href="{% url 'todo_app:todo-list' %}" class="btn btn-secondary">
        Cancel
      </a>
    </div>
  </form>

{% endblock %}
