{% extends "base.html" %}

{% block content %}
  <h1>Delete tag</h1>
  <p>Are you sure you want to delete the tag?
    <strong>{{ tag }}</strong>
  </p>
  <span class="text-muted">
      This action cannot be undone.
  </span>
  <form method="post">
    {% csrf_token %}
      <button type="submit" class="btn btn-danger">
        Yes, delete
      </button>
      <a href="{% url 'todo_app:tag-list' %}" class="btn btn-secondary">
        Cancel
      </a>
  </form>
{% endblock %}
